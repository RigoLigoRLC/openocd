set _CHIPNAME LS2K0300
set _CPUID 0x5a5a5a5a

adapter speed 2000

# Must specify -ignore-bypass because Loongson don't put a meaningful JTAG ID in their chips
# All of their chips has ID 0x5a5a5a5a, with the LSB not being set to 1, this leads to OpenOCD
# thinking we're dealing with a device under bypass. Ignore this check for good
jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUID -ignore-bypass -ir-bypass 0x0

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME loongarch64 -endian little -chain-position $_TARGETNAME
